[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-repro"
version = "0.1.0"
description = "Audited reproduction of the original SMC DL-DDQN scheduling study"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["smc_repro"]
